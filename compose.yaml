services:
  bombsquad:
    build:
      context: .
    container_name: bombsquad-server
    restart: unless-stopped
    network_mode: host
    working_dir: /app
    command:
      - /bin/bash
      - -lc
      - >-
        chmod +x /app/dist/bombsquad_headless
        /app/dist/bombsquad_headless_aarch64 &&
        exec python3.14 -OB /app/bombsquad_server --noninteractive
    environment:
      # repository/db.py stores its SQLite database below $HOME.
      HOME: /app
    volumes:
      # Persist all configuration, player data, the SQLite database, logs,
      # replays, and local mods in the VPS checkout.
      - .:/app
    init: true
    stop_grace_period: 30s
